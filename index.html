<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>중2수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="areaHatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="9" height="9" style="fill:var(--bg)"></rect>
        <line x1="0" y1="0" x2="0" y2="9" style="stroke:var(--accent);stroke-width:2.5;opacity:.4"></line>
      </pattern>
      <pattern id="shapeGrid" width="14" height="14" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="1.5" style="fill:var(--grid)"></circle>
      </pattern>
      <filter id="shapeShadow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0d1117" flood-opacity=".18"></feDropShadow>
      </filter>
    </defs>
  </svg>

  <div class="rotate-notice">
    <p class="rotate-icon" aria-hidden="true">📱</p>
    <p>휴대폰을 세로로 돌려주세요</p>
  </div>

  <div class="wrap">
    <header>
      <div>
        <h1>중2수학</h1>
        <p class="tagline">랜덤 사칙연산, 정답을 빠르게 입력하세요</p>
      </div>
      <button id="restartTop" class="restart-top" type="button" aria-label="다시 시작">⟳ 다시 시작</button>
    </header>

    <div class="stats">
      <div class="stat score-stat" id="scoreStat">
        <div class="label">점수</div>
        <div class="value" id="score">0</div>
      </div>
      <div class="stat streak">
        <div class="label">연속 정답</div>
        <div class="value" id="streak">0</div>
      </div>
      <div class="stat">
        <div class="label">최고 기록</div>
        <div class="value" id="best">0</div>
      </div>
    </div>

    <div class="card">
      <div class="timer-header">
        <span class="timer-icon" aria-hidden="true">⏱</span>
        <span class="timer-value" id="timeLeft">60</span>
        <span class="timer-unit">초 남음</span>
      </div>
      <div class="timebar-track"><div class="timebar-fill" id="timebar"></div></div>
      <span class="op-tag" id="opTag">덧셈</span>
      <div class="question-stage">
        <div class="shape-figure" id="shapeFigure" hidden></div>
        <p class="figure-caption" id="figureCaption" hidden><span class="eq">=</span> ?</p>
        <p class="equation" id="equation">7 <span class="eq">+</span> 5 <span class="eq">=</span> ?</p>
      </div>

      <div class="answer-row">
        <input id="answer" type="text" inputmode="none" autocomplete="off" readonly placeholder="정답" aria-label="정답 입력">
      </div>
      <p class="feedback" id="feedback">&nbsp;</p>

      <div class="keypad" id="keypad">
        <button data-key="7" type="button">7</button>
        <button data-key="8" type="button">8</button>
        <button data-key="9" type="button">9</button>
        <button data-key="4" type="button">4</button>
        <button data-key="5" type="button">5</button>
        <button data-key="6" type="button">6</button>
        <button data-key="1" type="button">1</button>
        <button data-key="2" type="button">2</button>
        <button data-key="3" type="button">3</button>
        <button data-key="back" class="key-back" type="button" aria-label="한 글자 지우기">⌫</button>
        <button data-key="0" type="button">0</button>
        <button data-key="clear" class="key-clear" type="button" aria-label="입력 초기화">초기화</button>
      </div>

      <div class="ops-legend" id="opsLegend">
        <button data-op="add" type="button" aria-pressed="true">+ 덧셈</button>
        <button data-op="sub" type="button" aria-pressed="true">− 뺄셈</button>
        <button data-op="mul" type="button" aria-pressed="true">× 곱셈</button>
        <button data-op="div" type="button" aria-pressed="true">÷ 나눗셈</button>
        <button data-op="shape" type="button" aria-pressed="true">◻ 도형</button>
        <button data-op="percent" type="button" aria-pressed="true">% 퍼센트</button>
        <button data-op="linear" type="button" aria-pressed="true">x 방정식</button>
      </div>

      <div class="game-over" id="gameOver" hidden>
        <p class="go-title">시간 종료!</p>
        <p class="go-score">최종 점수 <strong id="finalScore">0</strong></p>
        <p class="go-best">최고 기록 <strong id="finalBest">0</strong></p>
        <button id="restart" type="button">다시 시작</button>
      </div>

      <div class="start-screen" id="startScreen">
        <p class="go-title">중2수학</p>
        <p class="go-score">60초 안에 최대한 많이 풀어보세요</p>
        <button id="startBtn" type="button">게임 시작</button>
      </div>
    </div>

    <footer>60초 제한 · 정답마다 +2초 · 시간이 지날수록 문제가 어려워져요</footer>
  </div>

  <script src="script.js?v=20261007b"></script>
</body>
</html>
